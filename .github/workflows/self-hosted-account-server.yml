name: self-hosted account server

on:
  workflow_dispatch:
  push:
    branches:
      - feat/self-hosted-account-address-book
    paths:
      - "self-hosted/account-server/**"
      - ".github/workflows/self-hosted-account-server.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: self-hosted/account-server

      - name: Check formatting
        run: cargo fmt --manifest-path self-hosted/account-server/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --manifest-path self-hosted/account-server/Cargo.toml --locked

      - name: Build release binary
        run: cargo build --release --manifest-path self-hosted/account-server/Cargo.toml --locked

      - name: Package binary
        run: |
          install -D -m 0755 self-hosted/account-server/target/release/rustdesk-account-server artifact/rustdesk-account-server
          sha256sum artifact/rustdesk-account-server > artifact/SHA256SUMS
          cp self-hosted/account-server/Cargo.lock artifact/Cargo.lock

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-account-server-linux-amd64
          path: artifact/
          if-no-files-found: error
